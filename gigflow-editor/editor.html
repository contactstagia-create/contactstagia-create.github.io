ctive = white lyrics, inactive = lyrics colored by chord. Chord colors are always visible.",'✦ →Stagia — converts "classic format" text (chords on a separate line above lyrics) to Stagia Format. Acts on the current selection, or on the full content if nothing is selected.',"Transpose — enter semitones, ✓ applies to all chords and updates the key. ↺ restores.","Font — toggle between Courier New and Monospace (remembered). A− / A+ or Ctrl+− / Ctrl++ for size.","◀ (library top) — collapses the left panel into an icon rail to maximize the editing area."]},live:{keysTitle:"Keyboard in LIVE mode",keys:[{k:"← / →",v:"Previous / next section"},{k:"Space",v:"Next section"},{k:"PageUp / PageDown",v:"Previous / next page"},{k:"Ctrl+← / →",v:"Previous / next song (setlist)"},{k:"Ctrl++ / −",v:"Increase / decrease font size"},{k:"Escape",v:"Exit LIVE mode"}],tipsTitle:"Navigation & display",tips:["Section bar at top is clickable — jump directly to any section.","Automatic pagination: sections fit the screen height per page.","Red banner (setlist): name, Song X/Y position, remaining time.","♩ Chords / # Sec — hide chord diagrams and section labels.","Lyrics — active = white lyrics, inactive = colored lyrics. Chords always stay colored."],beatTitle:"Beat visual",beat:["Beat 1 = red, other beats = yellow. Subdivisions (&) = orange dots.","Click the squares or ▶/⏸ to start / stop.","− / + adjust the BPM. Tempo is taken from the song.","Follows the song time signature (3/4, 6/8, 5/4…)."]},chords:{diagTitle:"Chord diagrams",diag:["4 orientations: Vertical standard, Vertical left-handed, Horizontal low-E bottom ★, Horizontal low-E top.","Right-click in Chord Browser → copies [ChordName] notation to clipboard.","Multiple positions (Am, G, C, E…): ‹ › arrows to switch open / barré voicings.","~146 chords covered. Unknown chord → placeholder diagram ×."],importTitle:"Export / Import",import:["Import (Ctrl+O) — multi-file, silent merge, auto-detects file type.","Single export: ↗ in the editor (song) or in the setlist.","Full backup (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Chord library → gigflow-chords-YYYY-MM-DD.json"]},shortcuts:[{k:"Ctrl+N",v:"New song"},{k:"Ctrl+Shift+N",v:"New setlist"},{k:"Ctrl+S",v:"Save"},{k:"Ctrl+Z / Ctrl+Y",v:"Undo / Redo"},{k:"Ctrl+O",v:"Import JSON"},{k:"Ctrl+Shift+E",v:"Export all"},{k:"Ctrl+L",v:"Live mode"},{k:"Ctrl+H",v:"Help / FAQ"},{k:"Ctrl+F",v:"Search"},{k:"Ctrl+P",v:"Preview"},{k:"Ctrl+B",v:"Chord browser"},{k:"Ctrl+1 / 2",v:"Songs / Setlists"},{k:"Ctrl++ / − / 0",v:"Font larger / smaller / reset"},{k:"Tab",v:"2-space indent"},{k:"Escape (LIVE)",v:"Exit LIVE mode"},{k:"← → (LIVE)",v:"Prev / next section"},{k:"Space (LIVE)",v:"Next section"},{k:"Ctrl+← → (LIVE)",v:"Prev / next song"}],library:{importTitle:"Import / Export",importItems:["— IMPORT (Ctrl+O) —","Select one or more .json files in a single dialog.","Auto-detection of file type: songs, setlists, chords, or full backup.","Silent merge: existing items (same ID) are updated; new ones are added.","— EXPORT —","Full backup (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json  (songs + setlists + chords)","All songs → gigflow-songs-YYYY-MM-DD.json","Single song (↗ in editor) → gigflow-song-[title]-YYYY-MM-DD.json","All setlists → gigflow-setlists-YYYY-MM-DD.json","Single setlist (↗ in setlist) → gigflow-setlist-[name]-YYYY-MM-DD.json","Chord library → gigflow-chords-YYYY-MM-DD.json  (standard + custom chords)",'Multi-select (checkboxes) → "↑ Export" button to export a group of songs.'],songsTitle:"Song management",songsItems:["Ctrl+N or + button to create a new song.","Right-click a song → Duplicate / Export / Delete.","Multi-select (Ctrl+click) then delete or export as a group.","Search field (Ctrl+F) — filters by title, artist or key.","Sort by title, artist or key by clicking the column header."],setlistsTitle:"Setlist management",setlistsItems:["Ctrl+Shift+N or + button to create a setlist.","Drag & drop songs within a setlist to reorder.","Right-click a setlist → Duplicate / Delete.","Setlists are compatible with GigFlow Live mobile."]},close:"Close"},GER:{title:"GigFlow Editor — Hilfe",tabs:["Syntax","Editor","LIVE-Modus","Akkorde","Bibliothek","Tastenkürzel"],syntax:{previewLabel:"ZEILEN-RENDERING",previewNote:"Akkorde erscheinen über den Liedtexten. Jeder Akkord färbt den nachfolgenden Text bis zum nächsten Akkord.",exampleLabel:"VOLLSTÄNDIGES BEISPIEL",rows:[{token:"#AbschnittName",color:"#ee99ff",desc:"Neuer Abschnitt (Intro, Strophe, Refrain, Bridge…)"},{token:"[Am]",color:"#ff8899",desc:"Akkord allein auf einer Instrumentalzeile"},{token:"[Am]Wort",color:"#ff8899",desc:"Akkord auf einem Wort — Text erhält Akkordfarbe"},{token:"[Am]Syl[G]be",color:"#ff8899",desc:"Akkordwechsel mitten im Wort — jeder Teil hat seine Farbe"},{token:"[A] [E] [G]",color:"#ff8899",desc:"Instrumentalzeile — jeder Akkord hat seine eigene Farbe"},{token:"|Notiz|",color:"#50e3c2",desc:"Inline-Anmerkung — cyan kursiv (z.B. solo, x4, Capo 2…)"},{token:"{Text}",color:"#dde0ee",desc:"Chor / alle singen — unterstrichen, Klammern unsichtbar"},{token:"Lyrics",color:"#f0f0f2",desc:"Lyrics-Schaltfläche — einheitlich weiße Liedtexte (Farbe aus). Akkorde immer farbig."},{token:"60-Zeichen-Limit",color:"#ff8899",desc:"Zeilen > 60 Zeichen: roter linker Rand im Editor"}],example:`#intro

tagia — konvertiert "klassisches Format" (Akkorde auf separater Zeile) in Stagia-Format. Wirkt auf Auswahl oder gesamten Inhalt.',"Transponieren — Halbtöne eingeben, ✓ wendet auf alle Akkorde an. ↺ stellt wieder her.","Schrift — zwischen Courier New und Monospace wechseln. A− / A+ oder Ctrl+− / Ctrl++ für Größe.","◀ (Bibliothek oben) — klappt linkes Panel zu einer Icon-Leiste zusammen."]},live:{keysTitle:"Tastatur im LIVE-Modus",keys:[{k:"← / →",v:"Vorheriger / nächster Abschnitt"},{k:"Space",v:"Nächster Abschnitt"},{k:"PageUp / PageDown",v:"Vorherige / nächste Seite"},{k:"Ctrl+← / →",v:"Vorheriges / nächstes Lied (Setlist)"},{k:"Ctrl++ / −",v:"Schriftgröße vergrößern / verkleinern"},{k:"Escape",v:"LIVE-Modus verlassen"}],tipsTitle:"Navigation & Anzeige",tips:["Abschnittsleiste oben ist anklickbar — springt direkt zu einem Abschnitt.","Automatische Paginierung: Abschnitte passen in die Bildschirmhöhe.","Roter Banner (Setlist): Name, Lied X/Y, verbleibende Zeit.","♩ Akkorde / # Abschn. — blendet Diagramme und Abschnittsbezeichnungen aus.","Lyrics — aktiv = weiße Liedtexte, inaktiv = farbige. Akkorde immer farbig."],beatTitle:"Visueller Beat",beat:["Schlag 1 = rot, andere Schläge = gelb. Unterteilungen (&) = orangefarbene Punkte.","Auf Quadrate oder ▶/⏸ klicken zum Starten / Stoppen.","− / + passen BPM an. Tempo wird aus dem Lied übernommen.","Folgt der Taktart (3/4, 6/8, 5/4…)."]},chords:{diagTitle:"Akkord-Diagramme",diag:["4 Orientierungen: Vertikal Standard, Vertikal Linkshänder, Horizontal Tief-E unten ★, Horizontal Tief-E oben.","Rechtsklick in der Akkord-Datenbank → kopiert [AkkordName] in die Zwischenablage.","Mehrere Positionen (Am, G, C, E…): Pfeile ‹ › zum Wechseln.","~146 Akkorde abgedeckt. Unbekannter Akkord → Platzhalter-Diagramm ×."],importTitle:"Export / Import",import:["Importieren (Strg+O) — mehrere Dateien, stilles Zusammenführen, auto Typ-Erkennung.","Einzelexport: ↗ im Editor (Lied) oder in der Setlist.","Vollständige Sicherung (Strg+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Akkord-Bibliothek → gigflow-chords-YYYY-MM-DD.json"]},library:{importTitle:"Import / Export",importItems:["— IMPORTIEREN (Strg+O) —","Eine oder mehrere .json-Dateien auswählen.","Auto-Erkennung: Lieder, Setlisten, Akkorde oder vollständige Sicherung.","Stilles Zusammenführen: vorhandene Elemente (gleiche ID) werden aktualisiert, neue hinzugefügt.","— EXPORTIEREN —","Vollständige Sicherung (Strg+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Alle Lieder → gigflow-songs-YYYY-MM-DD.json","Ein Lied (↗ im Editor) → gigflow-song-[titel]-YYYY-MM-DD.json","Alle Setlisten → gigflow-setlists-YYYY-MM-DD.json","Eine Setlist (↗ in der Setlist) → gigflow-setlist-[name]-YYYY-MM-DD.json","Akkord-Bibliothek → gigflow-chords-YYYY-MM-DD.json  (Standard + eigene Akkorde)",'Mehrfachauswahl (Häkchen) → "↑ Export" in der Auswahlleiste.'],songsTitle:"Lieder verwalten",songsItems:["Ctrl+N oder + Button zum Erstellen eines neuen Liedes.","Rechtsklick → Duplizieren / Exportieren / Löschen.","Mehrfachauswahl (Ctrl+Klick) dann löschen oder als Gruppe exportieren.","Suchfeld (Ctrl+F) — filtert nach Titel, Künstler oder Tonart.","Sortierung durch Klick auf Spaltenüberschrift."],setlistsTitle:"Setlists verwalten",setlistsItems:["Ctrl+Shift+N oder + Button zum Erstellen einer Setlist.","Lieder per Drag & Drop neu anordnen.","Rechtsklick auf Setlist → Duplizieren / Löschen.","Setlists sind kompatibel mit GigFlow Live Mobile."]},shortcuts:[{k:"Ctrl+N",v:"Neues Lied"},{k:"Ctrl+Shift+N",v:"Neue Setlist"},{k:"Ctrl+S",v:"Speichern"},{k:"Ctrl+Z / Ctrl+Y",v:"Rückgängig / Wiederholen"},{k:"Ctrl+O",v:"JSON importieren"},{k:"Ctrl+Shift+E",v:"Alles exportieren"},{k:"Ctrl+L",v:"Live-Modus"},{k:"Ctrl+H",v:"Hilfe / FAQ"},{k:"Ctrl+F",v:"Suchen"},{k:"Ctrl+P",v:"Vorschau"},{k:"Ctrl+B",v:"Akkord-Datenbank"},{k:"Ctrl+1 / 2",v:"Lieder / Setlists"},{k:"Ctrl++ / − / 0",v:"Schrift gr. / kl. / Standard"},{k:"Tab",v:"2-Leerzeichen-Einzug"},{k:"Escape (LIVE)",v:"LIVE-Modus verlassen"},{k:"← → (LIVE)",v:"Vorher. / nächster Abschnitt"},{k:"Space (LIVE)",v:"Nächster Abschnitt"},{k:"Ctrl+← → (LIVE)",v:"Vorher. / nächstes Lied"}],close:"Schließen"},SPA:{title:"GigFlow Editor — Ayuda",tabs:["Sintaxis","Editor","Modo LIVE","Acordes","Biblioteca","Atajos"],syntax:{previewLabel:"RENDERIZADO DE LÍNEA",previewNote:"Los acordes aparecen encima de la letra. Cada acorde colorea el texto que le sigue hasta el próximo acorde.",exampleLabel:"EJEMPLO COMPLETO",rows:[{token:"#NombreSeccion",color:"#ee99ff",desc:"Nueva sección (intro, estrofa, estribillo, puente…)"},{token:"[Am]",color:"#ff8899",desc:"Acorde solo en una línea instrumental"},{token:"[Am]palabra",color:"#ff8899",desc:"Acorde en una palabra — el texto toma el color del acorde"},{token:"[Am]sí[G]la",color:"#ff8899",desc:"Cambio de acorde a mitad de palabra — cada parte tiene su color"},{token:"[A] [E] [G]",color:"#ff8899",desc:"Línea instrumental — cada acorde tiene su propio color"},{token:"|nota|",color:"#50e3c2",desc:"Anotación inline — cian cursiva (ej: solo, x4, cejilla 2…)"},{token:"{texto}",color:"#dde0ee",desc:"Coro / todos juntos — subrayado, llaves invisibles"},{token:"Lyrics",color:"#f0f0f2",desc:"Botón Lyrics — letra en blanco uniforme (color desactivado). Acordes siempre coloreados."},{token:"Límite 60 car.",color:"#ff8899",desc:"Líneas > 60 caracteres: borde rojo izquierdo en el editor"}],example:`#intro

[Am]Y después de [F]todo`,previewLine:"[Am]Hoy[G] va a ser el [F]día"},editor:{workflowTitle:"Método de introducción recomendado — paso a paso",workflow:["1. Pegar el texto bruto (letra) en el editor.","2. Insertar al menos una sección desde el principio: § Sección ▾ → #intro, #estrofa, #estribillo… Las secciones estructuran la barra de navegación y el modo LIVE.","3. Elegir los acordes: selector ♩ [Am] ▾ (pie del editor), paleta ⊞ (pegar la lista de acordes de una vez), o pestaña Acordes del panel derecho.","4. Posicionar el cursor donde debe ir el acorde (clic o teclas de flecha).",'5. Insertar el acorde en el cursor: clic en su botón en la paleta, o "insertar" en el selector.',"6. Repetir sección a sección hasta el final, luego guardar (Ctrl+S).","Truco paleta: pegar la lista de acordes (ej: Am G F C Em) de una vez. Cada acorde se convierte en un botón. Guardada por canción.","Truco — ✦ →Stagia: si el texto tiene acordes encima de la letra en línea separada, seleccionar y convertir automáticamente."],keysTitle:"Atajos del editor",keys:[{k:"Ctrl+S",v:"Guardar"},{k:"Ctrl+Z / Ctrl+Y",v:"Deshacer / Rehacer (150 estados)"},{k:"Tab",v:"Sangría de 2 espacios"},{k:"Ctrl++ / −",v:"Aumentar / reducir tamaño de fuente"}],tipsTitle:"Funcionalidades",tips:["La línea del cursor se resalta — indicador visual de posición.","Líneas > 60 caracteres: borde rojo izquierdo. Renderizado móvil optimizado para 60 caracteres.","Barra de secciones — haz clic en una sección para mover el cursor directamente.","§ Sección ▾ — abre menú desplegable para insertar sección (#intro, #estrofa…) en el cursor.",'♩ [Am] ▾ — abre el selector de acordes. Elige nota + calidad, luego "insertar". Los últimos 8 acordes están disponibles.',"⊞ Paleta — flujo rápido: pega lista de acordes (ej: Am G F C Em). Cada acorde → botón clicable. Guardado por canción.","♩ Diag — mostrar/ocultar barra de diagramas de acordes.","Lyrics (barra) — activo = letra blanca, inactivo = letra coloreada. Acordes siempre coloreados.",'✦ →Stagia — convierte texto en "formato clásico" a formato Stagia. Actúa en selección o todo el contenido.',"Transponer — ingresa semitonos, ✓ aplica a todos los acordes. ↺ restaura.","Fuente — alterna entre Courier New y Monospace. A− / A+ o Ctrl+− / Ctrl++ para tamaño.","◀ (arriba biblioteca) — colapsa el panel izquierdo en barra de iconos."]},live:{keysTitle:"Teclado en modo LIVE",keys:[{k:"← / →",v:"Sección anterior / siguiente"},{k:"Space",v:"Sección siguiente"},{k:"PageUp / PageDown",v:"Página anterior / siguiente"},{k:"Ctrl+← / →",v:"Canción anterior / siguiente (setlist)"},{k:"Ctrl++ / −",v:"Aumentar / reducir tamaño de fuente"},{k:"Escape",v:"Salir del modo LIVE"}],tipsTitle:"Navegación y visualización",tips:["La barra de secciones arriba es clicable — salta directamente a cualquier sección.","Paginación automática: las secciones caben en la altura de pantalla.","Banner rojo (setlist): nombre, posición Canción X/Y, tiempo restante.","♩ Acordes / # Secc. — oculta diagramas y etiquetas de sección.","Lyrics — activo = letra blanca, inactivo = letra coloreada. Acordes siempre coloreados."],beatTitle:"Beat visual",beat:["Tiempo 1 = rojo, otros tiempos = amarillo. Subdivisiones (&) = puntos naranjas.","Haz clic en los cuadrados o ▶/⏸ para iniciar / detener.","− / + ajustan el BPM. El tempo se toma de la canción.","Respeta la firma de compás (3/4, 6/8, 5/4…)."]},chords:{diagTitle:"Diagramas de acordes",diag:["4 orientaciones: Vertical estándar, Vertical zurdo, Horizontal Mi grave abajo ★, Horizontal Mi grave arriba.","Clic derecho en la Base de acordes → copia notación [Acorde] al portapapeles.","Múltiples posiciones (Am, G, C, E…): flechas ‹ › para alternar.","~146 acordes cubiertos. Acorde desconocido → diagrama marcador ×."],importTitle:"Exportar / Importar",import:["Importar (Ctrl+O) — varios archivos, fusión silenciosa, detección auto del tipo.","Export individual: ↗ en el editor (canción) o en la setlist.","Backup completo (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Biblioteca de acordes → gigflow-chords-YYYY-MM-DD.json"]},library:{importTitle:"Importar / Exportar",importItems:["— IMPORTAR (Ctrl+O) —","Seleccionar uno o varios archivos .json en una sola operación.","Detección automática: canciones, setlists, acordes o backup completo.","Fusión silenciosa: los elementos existentes (mismo ID) se actualizan; los nuevos se añaden.","— EXPORTAR —","Backup completo (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Todas las canciones → gigflow-songs-YYYY-MM-DD.json","Una canción (↗ en el editor) → gigflow-song-[título]-YYYY-MM-DD.json","Todas las setlists → gigflow-setlists-YYYY-MM-DD.json","Una setlist (↗ en la setlist) → gigflow-setlist-[nombre]-YYYY-MM-DD.json","Biblioteca de acordes → gigflow-chords-YYYY-MM-DD.json  (estándar + personalizados)",'Selección múltiple (casillas) → "↑ Export" en la barra de selección.'],songsTitle:"Gestión de canciones",songsItems:["Ctrl+N o botón + para crear nueva canción.","Clic derecho → Duplicar / Exportar / Eliminar.","Selección múltiple (Ctrl+clic) luego eliminar o exportar como grupo.","Campo de búsqueda (Ctrl+F) — filtra por título, artista o tonalidad.","Ordenar por título, artista o tonalidad clicando en el encabezado."],setlistsTitle:"Gestión de setlists",setlistsItems:["Ctrl+Shift+N o botón + para crear una setlist.","Arrastra y suelta canciones para reordenar.","Clic derecho en setlist → Duplicar / Eliminar.","Las setlists son compatibles con GigFlow Live móvil."]},shortcuts:[{k:"Ctrl+N",v:"Nueva canción"},{k:"Ctrl+Shift+N",v:"Nueva setlist"},{k:"Ctrl+S",v:"Guardar"},{k:"Ctrl+Z / Ctrl+Y",v:"Deshacer / Rehacer"},{k:"Ctrl+O",v:"Importar JSON"},{k:"Ctrl+Shift+E",v:"Exportar todo"},{k:"Ctrl+L",v:"Modo Live"},{k:"Ctrl+H",v:"Ayuda / FAQ"},{k:"Ctrl+F",v:"Buscar"},{k:"Ctrl+P",v:"Vista previa"},{k:"Ctrl+B",v:"Base de acordes"},{k:"Ctrl+1 / 2",v:"Canciones / Setlists"},{k:"Ctrl++ / − / 0",v:"Fuente mayor / menor / normal"},{k:"Tab",v:"Sangría 2 espacios"},{k:"Escape (LIVE)",v:" [Am]E dopo [F]tutto`,previewLine:"[Am]Og[G]gi sarà il [F]giorno"},editor:{workflowTitle:"Metodo di inserimento consigliato — passo dopo passo",workflow:["1. Incollare il testo grezzo (testo della canzone) nell'editor.","2. Inserire subito almeno una sezione: § Sezione ▾ → #intro, #strofa, #ritornello… Le sezioni strutturano la barra di navigazione e la modalità LIVE.","3. Scegliere gli accordi: selettore ♩ [Am] ▾ (piè di pagina editor), palette ⊞ (incollare la lista di accordi in una volta), o scheda Accordi nel pannello destro.","4. Posizionare il cursore dove deve andare l'accordo (clic o tasti freccia).",`5. Inserire l'accordo al cursore: clic sul pulsante nella palette, o "inserisci" nel selettore.`,"6. Ripetere sezione per sezione fino alla fine, poi salvare (Ctrl+S).","Suggerimento palette: incollare la lista accordi (es: Am G F C Em) in una volta. Ogni accordo diventa un pulsante. Salvata per brano.","Suggerimento — ✦ →Stagia: se il testo ha gli accordi sopra le parole su riga separata, selezionare e convertire automaticamente."],keysTitle:"Scorciatoie editor",keys:[{k:"Ctrl+S",v:"Salva"},{k:"Ctrl+Z / Ctrl+Y",v:"Annulla / Ripristina (150 stati)"},{k:"Tab",v:"Rientro 2 spazi"},{k:"Ctrl++ / −",v:"Aumenta / riduci dimensione font"}],tipsTitle:"Funzionalità",tips:["La riga del cursore è evidenziata — indicatore visivo di posizione.","Righe > 60 caratteri: bordo rosso sinistro. Rendering mobile ottimizzato per 60 caratteri.","Barra sezioni — clicca su una sezione per posizionare il cursore direttamente.","§ Sezione ▾ — apre menu a discesa per inserire sezione (#intro, #strofa…) al cursore.",'♩ [Am] ▾ — apre il selettore accordi. Scegli nota + qualità, poi "inserisci". Gli ultimi 8 accordi sono disponibili.',"⊞ Palette — flusso rapido: incolla lista accordi (es: Am G F C Em). Ogni acorde → pulsante cliccabile. Salvato per canzone.","♩ Diag — mostra/nascondi barra diagrammi accordi.","Lyrics (toolbar) — attivo = testi bianchi, inattivo = testi colorati. Accordi sempre colorati.",'✦ →Stagia — converte testo in "formato classico" in formato Stagia. Agisce sulla selezione o tutto il contenuto.',"Trasponi — inserisci semitoni, ✓ applica a tutti gli accordi. ↺ ripristina.","Font — alterna tra Courier New e Monospace. A− / A+ o Ctrl+− / Ctrl++ per la dimensione.","◀ (cima libreria) — riduce il pannello sinistro a una barra icone."]},live:{keysTitle:"Tastiera in modalità LIVE",keys:[{k:"← / →",v:"Sezione precedente / successiva"},{k:"Space",v:"Sezione successiva"},{k:"PageUp / PageDown",v:"Pagina precedente / successiva"},{k:"Ctrl+← / →",v:"Canzone precedente / successiva (scaletta)"},{k:"Ctrl++ / −",v:"Aumenta / riduci dimensione font"},{k:"Escape",v:"Esci dalla modalità LIVE"}],tipsTitle:"Navigazione e visualizzazione",tips:["La barra sezioni in alto è cliccabile — salta direttamente a qualsiasi sezione.","Paginazione automatica: le sezioni si adattano alla altezza dello schermo.","Banner rosso (scaletta): nome, posizione Canzone X/Y, tempo rimanente.","♩ Accordi / # Sez. — nascondi diagrammi ed etichette sezione.","Lyrics — attivo = testi bianchi, inattivo = testi colorati. Accordi sempre colorati."],beatTitle:"Beat visivo",beat:["Tempo 1 = rosso, altri tempi = giallo. Suddivisioni (&) = punti arancioni.","Clicca sui quadrati o ▶/⏸ per avviare / fermare.","− / + regolano il BPM. Il tempo viene preso dalla canzone.","Rispetta la firma del tempo (3/4, 6/8, 5/4…)."]},chords:{diagTitle:"Diagrammi accordi",diag:["4 orientamenti: Verticale standard, Verticale mancino, Orizzontale Mi basso in basso ★, Orizzontale Mi basso in alto.","Clic destro nel Database accordi → copia notazione [Accordo] negli appunti.","Posizioni multiple (Am, G, C, E…): frecce ‹ › per alternare.","~146 accordi coperti. Accordo sconosciuto → diagramma segnaposto ×."],importTitle:"Esporta / Importa",import:["Importa (Ctrl+O) — più file, unione silenziosa, rilevamento auto del tipo.","Export singolo: ↗ nell'editor (brano) o nella scaletta.","Backup completo (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Biblioteca accordi → gigflow-chords-YYYY-MM-DD.json"]},library:{importTitle:"Importa / Esporta",importItems:["— IMPORTA (Ctrl+O) —","Seleziona uno o più file .json in un'unica operazione.","Rilevamento automatico: brani, scalette, accordi o backup completo.","Unione silenziosa: gli elementi esistenti (stesso ID) vengono aggiornati; i nuovi vengono aggiunti.","— ESPORTA —","Backup completo (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Tutti i brani → gigflow-songs-YYYY-MM-DD.json","Un brano (↗ nell'editor) → gigflow-song-[titolo]-YYYY-MM-DD.json","Tutte le scalette → gigflow-setlists-YYYY-MM-DD.json","Una scaletta (↗ nella scaletta) → gigflow-setlist-[nome]-YYYY-MM-DD.json","Biblioteca accordi → gigflow-chords-YYYY-MM-DD.json  (standard + personalizzati)",'Selezione multipla (caselle) → "↑ Export" nella barra di selezione.'],songsTitle:"Gestione canzoni",songsItems:["Ctrl+N o pulsante + per creare una nuova canzone.","Clic destro → Duplica / Esporta / Elimina.","Selezione multipla (Ctrl+clic) poi elimina o esporta come gruppo.","Campo di ricerca (Ctrl+F) — filtra per titolo, artista o tonalità.","Ordina per titolo, artista o tonalità cliccando sull'intestazione."],setlistsTitle:"Gestione scalette",setlistsItems:["Ctrl+Shift+N o pulsante + per creare una scaletta.","Trascina e rilascia canzoni per riordinare.","Clic destro scaletta → Duplica / Elimina.","Le scalette sono compatibili con GigFlow Live mobile."]},shortcuts:[{k:"Ctrl+N",v:"Nuova canzone"},{k:"Ctrl+Shift+N",v:"Nuova scaletta"},{k:"Ctrl+S",v:"Salva"},{k:"Ctrl+Z / Ctrl+Y",v:"Annulla / Ripristina"},{k:"Ctrl+O",v:"Importa JSON"},{k:"Ctrl+Shift+E",v:"Esporta tutto"},{k:"Ctrl+L",v:"Modalità Live"},{k:"Ctrl+H",v:"Guida / FAQ"},{k:"Ctrl+F",v:"Cerca"},{k:"Ctrl+P",v:"Anteprima"},{k:"Ctrl+B",v:"Database accordi"},{k:"Ctrl+1 / 2",v:"Canzoni / Scalette"},{k:"Ctrl++ / − / 0",v:"Font grande / piccolo / normale"},{k:"Tab",v:"Rientro 2 spazi"},{k:"Escape (LIVE)",v:"Esci modalità LIVE"},{k:"← → (LIVE)",v:"Sez. precedente / successiva"},{k:"Space (LIVE)",v:"Sezione successiva"},{k:"Ctrl+← → (LIVE)",v:"Canzone precedente / successiva"}],close:"Chiudi"},POR:{title:"GigFlow Editor — Ajuda",tabs:["Sintaxe","Editor","Modo AO VIVO","Acordes","Biblioteca","Atalhos"],syntax:{previewLabel:"RENDERIZAÇÃO DA LINHA",previewNote:"Os acordes aparecem acima da letra. Cada acorde colore o texto que o segue até o próximo acorde.",exampleLabel:"EXEMPLO COMPLETO",rows:[{token:"#NomeSecao",color:"#ee99ff",desc:"Nova seção (intro, verso, refrão, bridge…)"},{token:"[Am]",color:"#ff8899",desc:"Acorde sozinho em uma linha instrumental"},{token:"[Am]palavra",color:"#ff8899",desc:"Acorde em uma palavra — o texto recebe a cor do acorde"},{token:"[Am]sí[G]la",color:"#ff8899",desc:"Mudança de acorde no meio da palavra — cada parte tem sua cor"},{token:"[A] [E] [G]",color:"#ff8899",desc:"Linha instrumental — cada acorde tem sua própria cor"},{token:"|nota|",color:"#50e3c2",desc:"Anotação inline — ciano itálico (ex: solo, x4, cejilha 2…)"},{token:"{texto}",color:"#dde0ee",desc:"Coro / todos juntos — sublinhado, chaves invisíveis"},{token:"Lyrics",color:"#f0f0f2",desc:"Botão Lyrics — letras em branco uniforme (cor desativada). Acordes sempre coloridos."},{token:"Limite 60 car.",color:"#ff8899",desc:"Linhas > 60 caracteres: borda vermelha esquerda no editor"}],example:`#intro

[Am]E depois de [F]tudo`,previewLine:"[Am]Ho[G]je vai ser o [F]dia"},editor:{workflowTitle:"Método de inserção recomendado — passo a passo",workflow:["1. Colar o texto bruto (letra) no editor.","2. Inserir pelo menos uma seção imediatamente: § Seção ▾ → #intro, #verso, #refrão… As seções estruturam a barra de navegação e o modo AO VIVO.","3. Escolher os acordes: seletor ♩ [Am] ▾ (rodapé do editor), paleta ⊞ (colar a lista de acordes de uma vez), ou aba Acordes no painel direito.","4. Posicionar o cursor onde o acorde deve ir (clique ou teclas de seta).",'5. Inserir o acorde no cursor: clique no botão na paleta, ou "inserir" no seletor.',"6. Repetir seção por seção até o fim, depois salvar (Ctrl+S).","Dica paleta: colar a lista de acordes (ex: Am G F C Em) de uma vez. Cada acorde vira um botão clicável. Salva por música.","Dica — ✦ →Stagia: se o texto tem acordes acima das letras em linha separada, selecionar e converter automaticamente."],keysTitle:"Atalhos do editor",keys:[{k:"Ctrl+S",v:"Salvar"},{k:"Ctrl+Z / Ctrl+Y",v:"Desfazer / Refazer (150 estados)"},{k:"Tab",v:"Recuo de 2 espaços"},{k:"Ctrl++ / −",v:"Aumentar / diminuir tamanho da fonte"}],tipsTitle:"Funcionalidades",tips:["A linha do cursor é realçada — indicador visual de posição.","Linhas > 60 caracteres: borda vermelha esquerda. Renderizado mobile otimizado para 60 caracteres.","Barra de seções — clique em uma seção para mover o cursor diretamente.","§ Seção ▾ — abre menu suspenso para inserir seção (#intro, #verso…) no cursor.",'♩ [Am] ▾ — abre o seletor de acordes. Escolha nota + qualidade, depois "inserir". Os últimos 8 acordes disponíveis.',"⊞ Paleta — fluxo rápido: cole lista de acordes (ex: Am G F C Em). Cada acorde → botão clicável. Salvo por música.","♩ Diag — mostrar/ocultar barra de diagramas de acordes.","Lyrics (barra) — ativo = letras brancas, inativo = letras coloridas. Acordes sempre coloridos.",'✦ →Stagia — converte texto em "formato clássico" para formato Stagia. Age na seleção ou no conteúdo completo.',"Transpor — insira semitons, ✓ aplica a todos os acordes. ↺ restaura.","Fonte — alterna entre Courier New e Monospace. A− / A+ ou Ctrl+− / Ctrl++ para tamanho.","◀ (topo da biblioteca) — colapsa o painel esquerdo em barra de ícones."]},live:{keysTitle:"Teclado no modo AO VIVO",keys:[{k:"← / →",v:"Seção anterior / próxima"},{k:"Space",v:"Próxima seção"},{k:"PageUp / PageDown",v:"Página anterior / próxima"},{k:"Ctrl+← / →",v:"Música anterior / próxima (setlist)"},{k:"Ctrl++ / −",v:"Aumentar / diminuir tamanho da fonte"},{k:"Escape",v:"Sair do modo AO VIVO"}],tipsTitle:"Navegação e exibição",tips:["A barra de seções no topo é clicável — pula diretamente para qualquer seção.","Paginação automática: as seções cabem na altura da tela.","Banner vermelho (setlist): nome, posição Música X/Y, tempo restante.","♩ Acordes / # Seções — oculta diagramas e rótulos de seção.","Lyrics — ativo = letras brancas, inativo = letras coloridas. Acordes sempre coloridos."],beatTitle:"Beat visual",beat:["Tempo 1 = vermelho, outros tempos = amarelo. Subdivisões (&) = pontos laranja.","Clique nos quadrados ou ▶/⏸ para iniciar / parar.","− / + ajustam o BPM. O andamento é retirado da música.","Segue a fórmula de compasso (3/4, 6/8, 5/4…)."]},chords:{diagTitle:"Diagramas de acordes",diag:["4 orientações: Vertical padrão, Vertical canhoto, Horizontal Mi grave abaixo ★, Horizontal Mi grave acima.","Clique direito na Base de acordes → copia notação [Acorde] para a área de transferência.","Múltiplas posições (Am, G, C, E…): setas ‹ › para alternar.","~146 acordes cobertos. Acorde desconhecido → diagrama marcador ×."],importTitle:"Exportar / Importar",import:["Importar (Ctrl+O) — vários arquivos, mesclagem silenciosa, detecção auto do tipo.","Export individual: ↗ no editor (música) ou na setlist.","Backup completo (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Biblioteca de acordes → gigflow-chords-YYYY-MM-DD.json"]},library:{importTitle:"Importar / Exportar",importItems:["— IMPORTAR (Ctrl+O) —","Selecionar um ou vários arquivos .json em uma única operação.","Detecção automática: músicas, setlists, acordes ou backup completo.","Mesclagem silenciosa: elementos existentes (mesmo ID) são atualizados; novos são adicionados.","— EXPORTAR —","Backup completo (Ctrl+Shift+E) → gigflow-backup-YYYY-MM-DD.json","Todas as músicas → gigflow-songs-YYYY-MM-DD.json","Uma música (↗ no editor) → gigflow-song-[título]-YYYY-MM-DD.json","Todas as setlists → gigflow-setlists-YYYY-MM-DD.json","Uma setlist (↗ na setlist) → gigflow-setlist-[nome]-YYYY-MM-DD.json","Biblioteca de acordes → gigflow-chords-YYYY-MM-DD.json  (padrão + personalizados)",'Seleção múltipla (caixas) → "↑ Export" na barra de seleção.'],songsTitle:"Gerenciar músicas",songsItems:["Ctrl+N ou botão + para criar uma nova música.","Clique direito → Duplicar / Exportar / Excluir.","Seleção múltipla (Ctrl+clique) depois excluir ou exportar como grupo.","Campo de busca (Ctrl+F) — filtra por título, artista ou tom.","Ordenar por título, artista ou tom clicando no cabeçalho da coluna."],setlistsTitle:"Gerenciar setlists",setlistsItems:["Ctrl+Shift+N ou botão + para criar uma setlist.","Arraste e solte músicas para reordenar.","Clique direito na setlist → Duplicar / Excluir.","As setlists são compatíveis com GigFlow Live mobile."]},shortcuts:[{k:"Ctrl+N",v:"Nova música"},{k:"Ctrl+Shift+N",v:"Nova setlist"},{k:"Ctrl+S",v:"Salvar"},{k:"Ctrl+Z / Ctrl+Y",v:"Desfazer / Refazer"},{k:"Ctrl+O",v:"Importar JSON"},{k:"Ctrl+Shift+E",v:"Exportar tudo"},{k:"Ctrl+L",v:"Modo Ao Vivo"},{k:"Ctrl+H",v:"Ajuda / FAQ"},{k:"Ctrl+F",v:"Buscar"},{k:"Ctrl+P",v:"Prévia"},{k:"Ctrl+B",v:"Base de acordes"},{k:"Ctrl+1 / 2",v:"Músicas / Setlists"},{k:"Ctrl++ / − / 0",v:"Fonte maior / menor / normal"},{k:"Tab",v:"Recuo 2 espaços"},{k:"Escape (AO VIVO)",v:"Sair do modo AO VIVO"},{k:"← → (AO VIVO)",v:"Seção anterior / próxima"},{k:"Space (AO VIVO)",v:"Próxima seção"},{k:"Ctrl+← → (AO VIVO)",v:"Música anterior / próxima"}],close:"Fechar"}},bz={fra:[{cat:"Stagia Format",icon:"♩",items:[{q:"Comment insérer un accord dans le texte ?",a:`Écris le nom entre crochets : [Am], [G7], [C#m]. Tu peux aussi utiliser le sélecteur ♩ dans la barre d'outils, cliquer sur un accord dans l'onglet "Accords" du panneau droit, ou utiliser la palette ⊞.`},{q:"Comment créer une section ?",a:"Commence une ligne par # suivi du nom : #Couplet, #Refrain, #Pont. La section apparaît en couleur dans la prévisualisation."},{q:"Comment ajouter une annotation ?",a:"Entoure le texte de pipes : |x2| ou |intro guitare|. S'affiche en cyan italique dans la prévisualisation."},{q:"Comment marquer un chœur / backing vocal ?",a:"Entoure le texte d'accolades : {Oh yeah, oh yeah}. S'affiche souligné."},{q:"Comment écrire les accords raccourcis ?",a:"Tu peux écrire A4 au lieu de Asus4, D2 au lieu de Dsus2. GigFlow convertit automatiquement."},{q:"Comment écrire un accord avec basse modifiée ?",a:"Utilise la notation slash : [G/B], [D/F#], [Am/C]. La note de basse est séparée par un /."}]},{cat:"Éditeur",icon:"✎",items:[{q:"Comment convertir un texte collé en Stagia Format ?",a:"Colle ton texte (format classique accords-au-dessus-des-paroles), puis clique sur ✦ →Stagia dans la barre d'outils. GigFlow fusionne les lignes automatiquement."},{q:"Comment transposer une chanson ?",a:"Utilise les boutons − et + dans les métadonnées (champ Transp.). Clique sur ✓ pour appliquer définitivement au texte."},{q:"Comment changer la taille de police ?",a:"Boutons A− et A+ dans la barre d'outils, ou Ctrl+− et Ctrl+=. Ctrl+0 pour la taille normale."},{q:"Comment utiliser la palette d'accords ?",a:"Clique sur ⊞ Palette, colle ta liste (Am G F C…), puis clique sur un accord pour l'insérer à la position du curseur."},{q:"Comment insérer une section depuis la barre d'outils ?",a:"Clique sur § Section ▾ dans la barre d'outils pour choisir : Couplet, Refrain, Pont, Intro…"},{q:"Comment annuler / rétablir une modification ?",a:"Ctrl+Z pour annuler, Ctrl+Y (ou Ctrl+Shift+Z) pour rétablir. L'historique est conservé par chanson."}]},{cat:"Mode Live",icon:"▶",items:[{q:"Comment lancer le mode Live ?",a:"Clique sur ▶ LIVE dans l'éditeur ou la prévisualisation, ou Ctrl+L depuis le menu Fichier."},{q:"Comment utiliser le métronome ?",a:"En mode Live, le BeatMetronome est dans le header. Clique sur ▶ pour démarrer. − et + ajustent le BPM. Le bouton & active les subdivisions."},{q:"Comment naviguer dans une setlist en Live ?",a:"Ouvre une setlist et clique ▶ LIVE. Les flèches ← → dans le header passent au song précédent / suivant."},{q:"Comment détacher la fenêtre Live ?",a:"Clique sur ⤢ Détacher dans l'onglet Live (panneau droit) pour ouvrir une fenêtre dédiée — idéal sur un second écran."},{q:"Comment afficher seulement les paroles en Live ?",a:"Active le toggle Lyrics dans le header du mode Live. Le texte s'affiche en blanc monochrome sans couleurs d'accords."}]},{cat:"Import / Export",icon:"↕",items:[{q:"Comment exporter vers GigFlow Live (Android) ?",a:"Fichier → Exporter → Export complet (Ctrl+Shift+E). Le fichier JSON est compatible avec GigFlow Live (Android)."},{q:"Comment sauvegarder toute ma bibliothèque ?",a:"Fichier → Exporter → Export complet (Ctrl+Shift+E). Importe ce fichier sur un autre PC ou pour restaurer tes données."},{q:"Comment exporter une setlist avec ses chansons ?",a:"Fichier → Exporter → Toutes les setlists… Le fichier contient toutes les setlists ET toutes leurs chansons. Pour une setlist seule : clic droit sur un titre → Exporter."},{q:"L'import écrase-t-il mes données existantes ?",a:"Non. L'import est toujours en mode fusion (merge) : il ajoute sans jamais écraser. Tes données actuelles sont préservées."},{q:"Comment afficher ou masquer les chansons de démo ?",a:"Affichage → Afficher/Masquer les démos. Le réglage est mémorisé."},{q:"Comment changer la langue de l'interface ?",a:"Affichage → Langue, puis choisis parmi les 6 langues disponibles. Le choix est mémorisé."}]},{cat:"Accords & Diagrammes",icon:"⬡",items:[{q:"Comment créer un diagramme d'accord personnalisé ?",a:"Deux façons : (1) Ouvre le sélecteur ♩, choisis une note et une qualité, puis clique sur ⊕ Créer. (2) Active les diagrammes (♩ diag), écris un accord inconnu — il affiche un cadre avec ⊕ Créer."},{q:"Comment rendre une corde muette dans un accord personnalisé ?",a:"Dans l'éditeur d'accord, clique sur ✕ sous la corde voulue — elle passe à −1 (corde non jouée, affichée ✕ dans le diagramme). Tu peux aussi saisir −1 directement dans le champ numérique."},{q:"Comment insérer un accord depuis l'onglet Accords ?",a:`Dans l'onglet "Accords" du panneau droit, clique sur le bouton "insérer" sous un diagramme pour l'insérer au curseur. 156 accords disponibles.`},{q:"Les bémols sont-ils reconnus ?",a:"Oui, mais GigFlow les convertit automatiquement en dièses : Bb → A#, Ab → G#, Eb → D#, etc."},{q:"Comment changer l'orientation des diagrammes ?",a:"Dans l'onglet Accords du panneau droit, utilise le sélecteur d'orientation : vertical standard, gaucher, ou horizontal."}]}],eng:[{cat:"Stagia Format",icon:"♩",items:[{q:"How do I insert a chord in the text?",a:'Write the chord name in brackets: [Am], [G7], [C#m]. You can also use the ♩ chord picker in the toolbar, click a chord in the "Chords" tab (right panel), or use the ⊞ palette.'},{q:"How do I create a section?",a:"Start a line with # followed by the name: #Verse, #Chorus, #Bridge. The section appears in color in the preview."},{q:"How do I add an annotation?",a:"Wrap text in pipes: |x2| or |guitar intro|. Displayed in italic cyan in the preview."},{q:"How do I mark a choir / backing vocal?",a:"Wrap text in curly braces: {Oh yeah, oh yeah}. Displayed underlined."},{q:"Can I use shorthand chord notation?",a:"Yes: write A4 instead of Asus4, D2 instead of Dsus2. GigFlow converts automatically."},{q:"How do I write a slash chord?",a:"Use slash notation: [G/B], [D/F#], [Am/C]. The bass note goes after the slash."}]},{cat:"Editor",icon:"✎",items:[{q:"How do I convert pasted text to Stagia Format?",a:"Paste your text (classic chords-above-lyrics format), then click ✦ →Stagia in the toolbar. GigFlow merges the lines automatically."},{q:"How do I transpose a song?",a:"Use the − and + buttons in the metadata (Transp. field). Click ✓ to apply permanently to the text."},{q:"How do I change the font size?",a:"A− and A+ buttons in the toolbar, or Ctrl+− and Ctrl+=. Ctrl+0 resets to default size."},{q:"How do I use the chord palette?",a:"Click ⊞ Palette, paste your list (Am G F C…), then click a chord to insert it at the cursor position."},{q:"How do I undo / redo?",a:"Ctrl+Z to undo, Ctrl+Y (or Ctrl+Shift+Z) to redo. History is kept per song."}]},{cat:"Live Mode",icon:"▶",items:[{q:"How do I launch Live mode?",a:"Click ▶ LIVE in the editor or preview, or use Ctrl+L from the File menu."},{q:"How do I use the metronome?",a:"In Live mode, the BeatMetronome is in the header. Click ▶ to start. − and + adjust BPM."},{q:"How do I navigate a setlist in Live mode?",a:"Open a setlist and click ▶ LIVE. The ← → arrows in the header switch to the previous / next song."}]},{cat:"Import / Export",icon:"↕",items:[{q:"How do I export to GigFlow Live (Android)?",a:"File → Export → Full backup (Ctrl+Shift+E). The JSON file is compatible with GigFlow Live (Android)."},{q:"How do I back up my entire library?",a:"File → Export → Full backup (Ctrl+Shift+E). Import this file on another PC or to restore your data."},{q:"How do I export a setlist with its songs?",a:"File → Export → All setlists… The file includes all setlists AND all their songs."},{q:"Does import overwrite my existing data?",a:"No. Import always runs in merge mode: it adds without ever overwriting. Your current data is preserved."},{q:"How do I show or hide demo songs?",a:"View → Show/Hide Demos. The setting is remembered."},{q:"How do I change the interface language?",a:"View → Language, then pick from 6 available languages. The choice is saved."}]},{cat:"Chords & Diagrams",icon:"⬡",items:[{q:"How   <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var pre = document.createElement('pre');
        pre.style.cssText = 'color:#e94560;padding:24px;background:#1a1a2e;height:100vh;margin:0;overflow:auto;font-family:monospace;font-size:12px';
        pre.textContent = 'Erreur JS avant React :\n' + msg + '\n\n' + (err && err.stack ? err.stack : src + ':' + line);
        document.getElementById('root').appendChild(pre);
      }
      window.addEventListener('unhandledrejection', function(e) {
        var pre = document.createElement('pre');
        pre.style.cssText = 'color:#f5c430;padding:24px;background:#1a1a2e;height:100vh;margin:0;overflow:auto;font-family:monospace;font-size:12px';
        pre.textContent = 'Promise rejetée :\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
        document.getElementById('root').appendChild(pre);
      })
    </script>
